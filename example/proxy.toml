# an edge that proxies to two upstreams, with health and overload bounds
[server]
name = "edge"

[server.features]
proxy = true

[[listener]]
name = "public"
address = "127.0.0.1:8080"
protocols = ["http/1.1"]

[host.site]
listener = "public"
server_name = "localhost"

[service.backend]
kind = "proxy"
upstream = "127.0.0.1:19081, 127.0.0.1:19082"

[[route]]
name = "all"
host = "site"
path = "/**"
service = "backend"

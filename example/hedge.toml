[server]
name = "example"

[[listener]]
name = "public"
address = "127.0.0.1:8080"
protocols = ["http/1.1"]

[host.site]
listener = "public"
server_name = "localhost"

[service.greeting]
kind = "fixed"
body = "hello from hedge\n"
content_type = "text/plain; charset=utf-8"

[service.docs]
kind = "redirect"
target = "https://example.test/docs/"
status = 308

[[route]]
name = "root"
host = "site"
path = "/hello"
service = "greeting"

[[route]]
name = "docs"
host = "site"
path = "/docs"
service = "docs"

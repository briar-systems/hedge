[project]
id      = "hedge"
version = "0.18.2"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.linux-riscv64]
arch = "riscv64"
sys = "linux"
abi = "lp64d"

[target.darwin-x86_64]
arch = "x86_64"
sys = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "darwinpcs"

[target.windows-x86_64]
arch = "x86_64"
sys = "windows"
abi = "win64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.hedge]
kind    = "bin"
default = true
entry   = "bin/main.mach"
out     = "{project.work}/bin/hedge{artifact.suffix}"
targets = ["*"]
link    = []
need    = []

# the test-only modules the executable never reaches: `mach test . -a tests`
# runs their tests
[artifact.tests]
kind    = "static"
entry   = "lib/tests.mach"
out     = "{project.work}/lib/libtests{artifact.suffix}"
targets = ["*"]
link    = []
need    = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^10.0.0"

[dep.crypto]
git = "https://github.com/briar-systems/mach-crypto"
version = "^0.30.0"

[dep.http]
git = "https://github.com/briar-systems/mach-http"
version = "^0.26.0"

[dep.tls]
git = "https://github.com/briar-systems/mach-tls"
version = "^0.18.0"

[dep.quic]
git = "https://github.com/briar-systems/mach-quic"
version = "^0.28.0"

[dep.acme]
git = "https://github.com/briar-systems/mach-acme"
version = "^0.15.0"

[dep.pki]
git = "https://github.com/briar-systems/mach-pki"
version = "^0.5.0"

[dep.toml]
git = "https://github.com/briar-systems/mach-toml"
version = "^0.1.0"

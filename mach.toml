[project]
id      = "hedge"
version = "0.1.0"
src     = "src"
out     = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.linux-riscv64]
isa = "riscv64"
os  = "linux"
abi = "lp64d"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[target.windows-x86_64]
isa = "x86_64"
os  = "windows"
abi = "win64"

[profile.debug]
opt   = 0
debug = true
simd  = "scalarize"

[profile.release]
opt   = 2
debug = false
simd  = "scalarize"

[artifact.hedge]
kind    = "bin"
entry   = "bin/main.mach"
out     = "bin/hedge"
targets = ["*"]
link    = []
need    = []

[dep.mach-std]
git = "https://github.com/briar-systems/mach-std"
ref = "tag/v0.33.0"

[dep.mach-http]
git = "https://github.com/briar-systems/mach-http"
ref = "tag/v0.5.0"

[dep.laurel]
git = "https://github.com/briar-systems/laurel"
ref = "tag/v0.6.0"

[dep.mach-tls]
git = "https://github.com/briar-systems/mach-tls"
ref = "tag/v0.1.0"

[dep.mach-quic]
git = "https://github.com/briar-systems/mach-quic"
ref = "tag/v0.3.0"

[dep.mach-acme]
git = "https://github.com/briar-systems/mach-acme"
ref = "tag/v0.1.1"

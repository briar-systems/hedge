[project]
id      = "hedge"
version = "0.10.0"
mach    = "^5.9"
src     = "src"
out     = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
default = true
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.linux-riscv64]
isa = "riscv64"
os  = "linux"
abi = "lp64d"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[target.windows-x86_64]
isa = "x86_64"
os  = "windows"
abi = "win64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.hedge]
kind    = "bin"
default = true
entry   = "bin/main.mach"
out     = "bin/hedge"
targets = ["*"]
link    = []
need    = []

# the test-only modules the executable never reaches: `mach test . --lib tests`
# runs their tests
[artifact.tests]
kind    = "static"
entry   = "test/all.mach"
out     = "lib/tests"
targets = ["*"]
link    = []
need    = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "=7.5.0"

[dep.crypto]
git = "https://github.com/briar-systems/mach-crypto"
version = "=0.20.0"

[dep.http]
git = "https://github.com/briar-systems/mach-http"
version = "=0.18.0"

[dep.tls]
git = "https://github.com/briar-systems/mach-tls"
version = "=0.10.0"

[dep.quic]
git = "https://github.com/briar-systems/mach-quic"
version = "=0.19.0"

[dep.acme]
git = "https://github.com/briar-systems/mach-acme"
version = "=0.7.1"

[dep.laurel]
git = "https://github.com/briar-systems/laurel"
version = "=0.16.1"

[project]
id      = "hedge"
version = "0.6.0"
src     = "src"
out     = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
default = true
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.linux-riscv64]
isa = "riscv64"
os  = "linux"
abi = "lp64d"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[target.windows-x86_64]
isa = "x86_64"
os  = "windows"
abi = "win64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.hedge]
kind    = "bin"
entry   = "bin/main.mach"
out     = "bin/hedge"
targets = ["*"]
link    = []
need    = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "tag/v4.2.0"

[dep.crypto]
git = "https://github.com/briar-systems/mach-crypto"
ref = "tag/v0.12.0"

[dep.http]
git = "https://github.com/briar-systems/mach-http"
ref = "tag/v0.11.0"

[dep.tls]
git = "https://github.com/briar-systems/mach-tls"
ref = "tag/v0.5.1"

[dep.quic]
git = "https://github.com/briar-systems/mach-quic"
ref = "tag/v0.11.0"

[dep.acme]
git = "https://github.com/briar-systems/mach-acme"
ref = "tag/v0.4.2"

[dep.laurel]
git = "https://github.com/briar-systems/laurel"
ref = "tag/v0.13.3"

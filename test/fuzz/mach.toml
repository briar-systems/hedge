[project]
id = "fuzz"
version = "0.0.0"
mach = "^7"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.linux-riscv64]
arch = "riscv64"
sys = "linux"
abi = "lp64d"

[target.darwin-x86_64]
arch = "x86_64"
sys = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "darwinpcs"

[target.windows-x86_64]
arch = "x86_64"
sys = "windows"
abi = "win64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.fuzz]
kind = "bin"
entry = "bin/fuzz.mach"
out = "{project.work}/bin/fuzz{artifact.suffix}"
targets = ["*"]
link = []
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"

[dep.crypto]
git = "https://github.com/briar-systems/mach-crypto"
ref = "branch/dev"

[dep.http]
git = "https://github.com/briar-systems/mach-http"
ref = "branch/dev"

[dep.quic]
git = "https://github.com/briar-systems/mach-quic"
ref = "branch/dev"

[dep.tls]
git = "https://github.com/briar-systems/mach-tls"
ref = "branch/dev"

[dep.hedge]
path = "../.."

[dep.pki]
git = "https://github.com/briar-systems/mach-pki"
ref = "branch/dev"

[dep.toml]
git = "https://github.com/briar-systems/mach-toml"
ref = "branch/dev"

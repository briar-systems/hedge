[project]
id = "fuzz"
version = "0.0.0"
mach = "^6.2.1"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
default = true
isa = "x86_64"
os = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os = "linux"
abi = "aapcs64"

[target.linux-riscv64]
isa = "riscv64"
os = "linux"
abi = "lp64d"

[target.darwin-x86_64]
isa = "x86_64"
os = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os = "darwin"
abi = "aapcs64"

[target.windows-x86_64]
isa = "x86_64"
os = "windows"
abi = "win64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.fuzz]
kind = "bin"
entry = "bin/fuzz.mach"
out = "bin/fuzz"
targets = ["*"]
link = []
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^9.1.0"

[dep.crypto]
git = "https://github.com/briar-systems/mach-crypto"
version = "=0.24.0"

[dep.http]
git = "https://github.com/briar-systems/mach-http"
version = "=0.21.0"

[dep.quic]
git = "https://github.com/briar-systems/mach-quic"
version = "=0.22.0"

[dep.tls]
git = "https://github.com/briar-systems/mach-tls"
version = "=0.14.0"

[dep.hedge]
path = "../.."

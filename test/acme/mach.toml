[project]
id = "hedgeacme"
version = "0.0.0"
mach = "^5.9"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
default = true
isa = "x86_64"
os = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os = "linux"
abi = "aapcs64"

[target.linux-riscv64]
isa = "riscv64"
os = "linux"
abi = "lp64d"

[target.darwin-x86_64]
isa = "x86_64"
os = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os = "darwin"
abi = "aapcs64"

[target.windows-x86_64]
isa = "x86_64"
os = "windows"
abi = "win64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.hedgeacme]
kind = "static"
entry = "tests.mach"
out = "lib/hedgeacme"
targets = ["*"]
link = []
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "tag/v6.1.0"

[dep.crypto]
git = "https://github.com/briar-systems/mach-crypto"
ref = "tag/v0.19.0"

# http and quic are declared here to override the older selectors that hedge's
# own dependencies (acme, laurel) still carry, matching hedge's root pins
[dep.http]
git = "https://github.com/briar-systems/mach-http"
ref = "tag/v0.15.0"

[dep.quic]
git = "https://github.com/briar-systems/mach-quic"
ref = "tag/v0.17.0"

[dep.tls]
git = "https://github.com/briar-systems/mach-tls"
ref = "tag/v0.9.0"

[dep.hedge]
path = "../.."

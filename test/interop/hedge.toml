[server]
name = "hedge-interop"

[[listener]]
name = "cleartext"
address = "127.0.0.1:9080"
protocols = ["http/1.1", "h2"]

[[listener]]
name = "secure"
address = "127.0.0.1:9443"
protocols = ["http/1.1", "h2"]
tls = "public"

[tls.public]
identity = [
  { server_name = "api.example.com", certificate = "test/interop/fixtures/api.pem", key = "test/interop/fixtures/api.key" },
  { server_name = "alt.example.com", certificate = "test/interop/fixtures/alt.pem", key = "test/interop/fixtures/alt.key" },
  { server_name = "*.example.com", certificate = "test/interop/fixtures/wild.pem", key = "test/interop/fixtures/wild.key" },
]
default = "api.example.com"

[host.plain]
listener = "cleartext"
server_name = "localhost"

[host.site]
listener = "secure"
names = ["api.example.com", "alt.example.com", "localhost"]

[service.greeting]
kind = "fixed"
body = "hello from hedge\n"
content_type = "text/plain; charset=utf-8"

[[route]]
name = "plain-files"
host = "plain"
path = "/files/**"
service = "files"

[[route]]
name = "plain-echo"
host = "plain"
path = "/echo"
service = "echo"

[[route]]
name = "plain-root"
host = "plain"
path = "/**"
service = "greeting"

[service.files]
kind = "static"
root = "./test/interop/public"

[service.echo]
kind = "fixed"
body = "echoed\n"
content_type = "text/plain; charset=utf-8"

[[route]]
name = "files"
host = "site"
path = "/files/**"
service = "files"

[[route]]
name = "echo"
host = "site"
path = "/echo"
service = "echo"

[[route]]
name = "root"
host = "site"
path = "/**"
service = "greeting"

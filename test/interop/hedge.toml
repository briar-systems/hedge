[server]
name = "hedge-interop"

[[listener]]
name = "cleartext"
address = "127.0.0.1:9080"
protocols = ["http/1.1", "h2"]

[[listener]]
name = "secure"
address = "127.0.0.1:9443"
protocols = ["http/1.1", "h2"]
tls = "public"

[[listener]]
name = "quic"
address = "127.0.0.1:9443"
transport = "quic"
protocols = ["h3"]
tls = "public"

[[listener]]
name = "proxied"
address = "127.0.0.1:9081"
protocols = ["http/1.1", "h2"]
proxy_protocol = "required"
trusted_peers = ["127.0.0.1"]

[[listener]]
name = "h2only"
address = "127.0.0.1:9082"
protocols = ["h2"]

[tls.public]
identity = [
  { server_name = "api.example.com", certificate = "test/interop/fixtures/api.pem", key = "test/interop/fixtures/api.key" },
  { server_name = "alt.example.com", certificate = "test/interop/fixtures/alt.pem", key = "test/interop/fixtures/alt.key" },
  { server_name = "*.example.com", certificate = "test/interop/fixtures/wild.pem", key = "test/interop/fixtures/wild.key" },
]
default = "api.example.com"

[tls.public.resumption]
key_lifetime_seconds = 3600
retirement_overlap_seconds = 1800
ticket_lifetime_seconds = 7200
replay = "single_use"
tickets_per_connection = 2

[host.plain]
listener = "cleartext"
server_name = "localhost"

[host.proxied]
listener = "proxied"
server_name = "proxied.test"

[host.h2only]
listener = "h2only"
server_name = "h2only.test"

[host.site]
listener = "secure"
server_name = "api.example.com"

# routing carries no listener dimension: host.site's routes already serve
# api.example.com over every listener. this block exists so the quic listener's
# TLS policy is checked to cover the name it serves.
[host.h3]
listener = "quic"
server_name = "api.example.com"

# one host per served name: hedge routes on the first name a host declares, so
# a second name in the same block would negotiate TLS and then fail to route
[host.alt]
listener = "secure"
server_name = "alt.example.com"

[host.wild]
listener = "secure"
server_name = "*.example.com"

[service.greeting]
kind = "fixed"
body = "hello from hedge\n"
content_type = "text/plain; charset=utf-8"

[[route]]
name = "plain-files"
host = "plain"
path = "/files/**"
service = "files"

[[route]]
name = "plain-echo"
host = "plain"
path = "/echo"
service = "echo"

[[route]]
name = "plain-root"
host = "plain"
path = "/**"
service = "greeting"

[service.files]
kind = "static"
root = "./test/interop/public"

[service.echo]
kind = "fixed"
body = "echoed\n"
content_type = "text/plain; charset=utf-8"

[[route]]
name = "files"
host = "site"
path = "/files/**"
service = "files"

[[route]]
name = "echo"
host = "site"
path = "/echo"
service = "echo"

[[route]]
name = "root"
host = "site"
path = "/**"
service = "greeting"

[[route]]
name = "proxied-root"
host = "proxied"
path = "/**"
service = "greeting"

[[route]]
name = "h2only-root"
host = "h2only"
path = "/**"
service = "greeting"

[[route]]
name = "alt-root"
host = "alt"
path = "/**"
service = "greeting"

[[route]]
name = "wild-root"
host = "wild"
path = "/**"
service = "greeting"

[server]
name = "hedge-telemetry-interop"

[[listener]]
name = "public"
address = "127.0.0.1:9087"
protocols = ["http/1.1"]

[[listener]]
name = "admin"
address = "127.0.0.1:9088"
protocols = ["http/1.1"]

[host.site]
listener = "public"
server_name = "localhost"

[service.greeting]
kind = "fixed"
body = "public\n"
content_type = "text/plain"

[[route]]
name = "public-root"
host = "site"
path = "/**"
service = "greeting"

[secret.admin-token]
provider = "env"
key = "HEDGE_ADMIN_TOKEN"

[telemetry]
logs = true
metrics = true
traces = true
log_record_bytes = 1024
log_queue_depth = 16
metric_series = 40
trace_state_bytes = 512

[admin]
enabled = true
listener = "admin"
auth_secret = "admin-token"
max_response_bytes = 8192

# a listener with a short drain deadline, so a shutdown with a peer still
# holding a request open reaches the deadline within the life of a test

[server]
name = "hedge-shutdown"

[server.timeouts]
drain_ms = 300

[[listener]]
name = "cleartext"
address = "127.0.0.1:9085"
protocols = ["http/1.1", "h2"]

[host.plain]
listener = "cleartext"
server_name = "localhost"

[service.greeting]
kind = "fixed"
body = "hello from hedge\n"
content_type = "text/plain; charset=utf-8"

[[route]]
name = "root"
host = "plain"
path = "/**"
service = "greeting"

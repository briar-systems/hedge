[server]
# the arena comparison holds everything but the cache equal, workers included
workers = 1
name = "hedge-cache-disabled"

[[listener]]
name = "public"
address = "127.0.0.1:9086"
protocols = ["http/1.1"]

[host.site]
listener = "public"
server_name = "localhost"

[service.greeting]
kind = "fixed"
body = "cache disabled\n"
content_type = "text/plain"
cache = true

[[route]]
name = "root"
host = "site"
path = "/**"
service = "greeting"

[telemetry]
logs = false

[cache]
enabled = false
memory_bytes = 268435456
disk_bytes = 1048576
disk_root = "/tmp/hedge-disabled-cache-must-not-open"
max_entry_bytes = 1048576
entries = 128

# a narrow route and its static root, both replaced by a reload

[server]
name = "hedge-reload"

[server.timeouts]
drain_ms = 300

[[listener]]
name = "cleartext"
address = "127.0.0.1:9086"
protocols = ["http/1.1"]

[host.plain]
listener = "cleartext"
server_name = "localhost"

[service.greeting]
kind = "static"
root = "./test/interop/reload-v1"

[[route]]
name = "root"
host = "plain"
path = "/hello"
service = "greeting"

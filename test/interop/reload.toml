# a narrow route, widened by a reload. the service set is identical either way,
# which is what a routing reload is allowed to change.

[server]
name = "hedge-reload"

[server.timeouts]
drain_ms = 300

[[listener]]
name = "cleartext"
address = "127.0.0.1:9086"
protocols = ["http/1.1"]

[host.plain]
listener = "cleartext"
server_name = "localhost"

[service.greeting]
kind = "fixed"
body = "served\n"
content_type = "text/plain; charset=utf-8"

[[route]]
name = "root"
host = "plain"
path = "/hello"
service = "greeting"

[project]
id = "hedgetest"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os = "linux"
abi = "aapcs64"

[target.linux-riscv64]
isa = "riscv64"
os = "linux"
abi = "lp64d"

[target.darwin-x86_64]
isa = "x86_64"
os = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os = "darwin"
abi = "aapcs64"

[target.windows-x86_64]
isa = "x86_64"
os = "windows"
abi = "win64"

[profile.debug]
opt = 0
# the harness compiles the whole runtime into one test binary; with debug
# info its peak exceeds 18 GiB and is OOM-killed on a 32 GiB machine, without
# it the peak stays under 18 GiB and every test still runs
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[artifact.hedgetest]
kind = "static"
entry = "tests.mach"
out = "lib/hedgetest"
targets = ["*"]
link = []
need = []

[dep.hedge]
path = "../.."

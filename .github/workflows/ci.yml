name: CI

on:
  pull_request:
    branches: [dev, main]
  # release branches also build on push. a pull_request trigger is selected from
  # the base branch, so adding `main` above cannot take effect for the very PR
  # that adds it, the first release PR would still land untested.
  push:
    branches:
      - 'chore/release-*'
      - 'hotfix/*'

jobs:
  linux-x86_64:
    name: linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Seed mach
        uses: ./.github/actions/seed-mach

      - name: Report the seed
        run: mach info

      # test/acme/harness/build.sh builds pebble, its challenge test server, and
      # the plain-http front end on first use, so a clean checkout needs only Go
      # on the path. it fetches them from the public module proxy.
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          mach dep pull .
          mach dep pull test/acme

      - name: Build
        run: mach build .

      - name: Test
        run: mach test . --profile debug

      - name: Test (release)
        run: mach test . --profile release

      # test/acme drives a real ACME authority on loopback rather than a
      # fixture, so it is the only leg that proves the wire behaviour end to
      # end. the stack is pebble, its challenge test server, and a plain-http
      # front end.
      - name: Start the live ACME stack
        run: test/acme/harness/start.sh

      - name: Test against the live authority
        run: mach test test/acme --profile debug --jobs 1

      - name: Test against the live authority (release)
        run: mach test test/acme --profile release --jobs 1

      # always, so a failed live test still tears the stack down rather than
      # leaving three listeners bound for the rest of the job.
      - name: Stop the live ACME stack
        if: always()
        run: test/acme/harness/start.sh.stop

      - name: Retain the live stack logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-stack-logs
          path: .tools/run/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Build every target
        run: mach build . --all-targets --profile release

name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      heavy:
        type: string
        default: none
  workflow_dispatch:
    inputs:
      heavy:
        description: heavy work to run on this ref
        type: choice
        default: none
        options: [none, all, aarch64-linux, x86_64-windows, aarch64-darwin, x86_64-darwin, fuzz]

permissions:
  contents: read

jobs:
  # the live ACME stack and the load lane run on x86_64-linux in the light tier.
  # they are the only tests that put real wire traffic through the executable:
  # #122 (unserved TLS connections) and #143 (HTTP/3 not served at all) each
  # merged because nothing like them ran on the pull request.
  lib:
    uses: briar-systems/.github/.github/workflows/mach-lib.yml@main
    with:
      heavy: ${{ inputs.heavy }}
      # http 0.25.1 requires mach 6.5
      mach-version: v6.5.0
      # crypto 0.17 and later link a DIT-required aarch64 start, so a runner
      # without FEAT_DIT runs the tests under qemu-aarch64 -cpu max
      dit: required
      # bin/main.mach reaches none of src/test/, so its tests run under the
      # tests artifact (#260)
      test-selections: '[["--lib", "tests"]]'
      legs: >-
        [{"name": "x86_64-linux", "runs-on": "ubuntu-latest", "tier": "light"},
         {"name": "aarch64-linux", "runs-on": "ubuntu-24.04-arm", "tier": "heavy"},
         {"name": "x86_64-windows", "runs-on": "windows-latest", "tier": "heavy"},
         {"name": "aarch64-darwin", "runs-on": "macos-15", "tier": "heavy"},
         {"name": "x86_64-darwin", "runs-on": "macos-15-intel", "tier": "heavy"}]
      # test/acme and test/fuzz resolve hedge as a non-root, so each starts from
      # an empty dep/ and pulls the gitlinks committed under its own dep/.
      # the acme cases share one live authority, so they run one at a time. the
      # fuzz lane is built so it cannot rot, and replayed by the fuzz job
      subprojects: >-
        [{"path": "test/acme", "clean-dep": true, "jobs": 1, "legs": ["x86_64-linux"]},
         {"path": "test/fuzz", "clean-dep": true, "build": true, "test": false, "legs": ["x86_64-linux"]}]
      evidence: |
        .tools/run/*.log

  # the fuzz lane's deterministic replay: every retained input in
  # test/fuzz/corpus answered by its boundary's harness, on the heavy tier
  fuzz:
    if: github.base_ref == 'main' || inputs.heavy == 'all' || inputs.heavy == 'fuzz'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: briar-systems/.github/.github/actions/seed-mach@main
        with:
          tag: v6.5.0
      - name: build the lane
        run: |
          mach dep pull test/fuzz
          mach build test/fuzz --profile debug
          mach build test/fuzz --profile release
      # both profiles, because optimisation has changed observable behaviour here before
      - name: replay the corpus
        run: |
          timeout 10m test/fuzz/out/linux-x86_64/debug/bin/fuzz replay
          timeout 10m test/fuzz/out/linux-x86_64/release/bin/fuzz replay

  gate:
    if: always()
    needs: [lib, fuzz]
    runs-on: ubuntu-latest
    steps:
      - uses: briar-systems/.github/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}

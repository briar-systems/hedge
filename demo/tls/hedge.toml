# the same directory over TLS 1.3, with three protocols on one address.
#
# the TCP listener offers http/1.1 and h2 through ALPN; the QUIC listener binds
# the same port over UDP and offers h3. both name the same TLS policy, so one
# certificate covers all three.

[server]
name = "tls-demo"

[[listener]]
name = "secure"
address = "127.0.0.1:8443"
protocols = ["http/1.1", "h2"]
tls = "public"

[[listener]]
name = "quic"
address = "127.0.0.1:8443"
transport = "quic"
protocols = ["h3"]
tls = "public"

[tls.public]
identity = [
  { server_name = "localhost", certificate = "./demo/tls/.certs/demo.pem", key = "./demo/tls/.certs/demo.key" },
]
default = "localhost"

# host.site owns the routes. host.h3 attaches the same name to the QUIC
# listener so it has a TLS policy to select a certificate from; routing itself
# carries no listener dimension, so the routes below serve both listeners.
[host.site]
listener = "secure"
server_name = "localhost"

[host.h3]
listener = "quic"
server_name = "localhost"

[service.files]
kind = "static"
root = "./demo/tls/public"
index = "index.html"

[[route]]
name = "everything"
host = "site"
path = "/**"
service = "files"
